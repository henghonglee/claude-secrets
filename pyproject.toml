[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-secrets"
version = "1.0.8"
description = "Intelligent secrets proxy for MCP clients"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "lightsprint" }
]
keywords = ["mcp", "secrets", "cli", "llm", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "click>=8.0",
    "mcp>=1.0",
    "cryptography>=41.0",
    "rich>=13.0",
    "rumps>=0.4.0; sys_platform == 'darwin'",
    "Flask>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]

[project.scripts]
mcp-secrets = "mcp_secrets.cli:main"
mcp-secrets-menubar = "mcp_secrets.menubar:run_menubar"

[project.urls]
Homepage = "https://github.com/henghonglee/mcp-secrets"
Repository = "https://github.com/henghonglee/mcp-secrets"
Issues = "https://github.com/henghonglee/mcp-secrets/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_secrets"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
